<!DOCTYPE html>
<html>
<head>

<title>Column Reordering</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

<div class="row">

<div class="col-md-6 order-md-2 bg-success text-white p-4">
Second On Desktop
</div>

<div class="col-md-6 order-md-1 bg-danger text-white p-4">
First On Desktop
</div>

</div>

</div>

</body>
</html>
